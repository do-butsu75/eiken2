.sub { color: #666; font-size: 13px; margin: 0 0 8px; }

section { margin-bottom: 12px; }

.field-inline { display: block; font-size: 13px; color: #666; margin-bottom: 8px; }

  background: #333;
  color: #fff;
  cursor: pointer;

}
.main-btn:disabled { opacity: .4; cursor: not-allowed; }
.main-btn.small { width: auto; padding: 8px 20px; }

.text-btn {
  background: none;
  border: none;
  color: #333;
  font-size: 14px;
  cursor: pointer;
  padding: 6px 4px;
}
.text-btn:disabled { opacity: .3; cursor: default; }

.top-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #666;
  margin-bottom: 12px;
}

.card-area {
  border: 1px solid #ccc;
  padding: 40px 16px;
  text-align: center;
  cursor: pointer;
  min-height: 160px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.no-label { font-size: 12px; color: #888; margin-bottom: 12px; }
.front { font-size: 24px; font-weight: 600; }
.back { font-size: 17px; color: #333; margin-top: 16px; }
.back.placeholder { color: #aaa; font-size: 14px; }

.btn-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
}

<script>
const { useState, useMemo, useEffect } = React;
const h = React.createElement;

const SETTINGS_KEY = "vocabFlashSettings_v1";

function loadSettings() {
  const defaults = {
    rangeSpec: "",
    count: "",
    order: "sequential",
    direction: "e2j", // e2j: 英語→日本語, j2e: 日本語→英語
  };
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "null");
    if (saved && typeof saved === "object") {
      return Object.assign({}, defaults, saved);
    }
  } catch (e) {}
  return defaults;
}

function saveSettings(settings) {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch (e) {}
}

function parseRanges(spec) {
  if (!spec || !spec.trim()) return null;
  const set = new Set();
  spec
    .split(",")
    .map((s) => s.trim())
    .filter(Boolean)
    .forEach((part) => {
      const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m) {
        let a = parseInt(m[1], 10);
        let b = parseInt(m[2], 10);
        if (a > b) [a, b] = [b, a];
        for (let n = a; n <= b; n++) set.add(n);
      } else if (/^\d+$/.test(part)) {
        set.add(parseInt(part, 10));
      }
    });
  return set;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getFilteredPool(settings) {
  const allowed = parseRanges(settings.rangeSpec);
  return WORDS.filter((w) => {
    const no = w[0];
    if (allowed && !allowed.has(no)) return false;
    return true;
  });
}

function buildCards(pool, settings) {
  let ordered = settings.order === "random" ? shuffle(pool) : pool.slice().sort((a, b) => a[0] - b[0]);
  const countNum = settings.count.trim() === "" ? ordered.length : Math.max(1, parseInt(settings.count, 10) || ordered.length);
  return ordered.slice(0, Math.min(countNum, ordered.length));
}

function App() {
  const [settings, setSettings] = useState(loadSettings);
  const [screen, setScreen] = useState("setup"); // setup | study | done
  const [cards, setCards] = useState([]);
  const [index, setIndex] = useState(0);
  const [revealed, setRevealed] = useState(false);

  useEffect(() => {
    saveSettings(settings);
  }, [settings]);

  const poolSize = useMemo(() => getFilteredPool(settings).length, [settings]);

  function start() {
    const pool = getFilteredPool(settings);
    if (pool.length === 0) {
      alert("条件に一致する単語がありません。");
      return;
    }
    setCards(buildCards(pool, settings));
    setIndex(0);
    setRevealed(false);
    setScreen("study");
  }

  function next() {
    if (index + 1 >= cards.length) {
      setScreen("done");
      return;
    }
    setIndex((i) => i + 1);
    setRevealed(false);
  }

  function prev() {
    if (index === 0) return;
    setIndex((i) => i - 1);
    setRevealed(false);
  }

  function onKeyDown(e) {
    if (screen !== "study") return;
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      setRevealed((r) => !r);
    } else if (e.key === "ArrowRight") {
      next();
    } else if (e.key === "ArrowLeft") {
      prev();
    }
  }

  useEffect(() => {
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  });

  if (screen === "setup") return h(SetupScreen, { settings, setSettings, poolSize, start });
  if (screen === "study")
    return h(StudyScreen, {
      card: cards[index],
      index,
      total: cards.length,
      revealed,
      direction: settings.direction,
      setRevealed,
      next,
      prev,
      backToSetup: () => setScreen("setup"),
    });
  return h(DoneScreen, { total: cards.length, restart: start, backToSetup: () => setScreen("setup") });
}

function SetupScreen({ settings, setSettings, poolSize, start }) {
  return h(
    "div",
    { className: "screen" },
    h("h1", null, "英検2級 単語テスト"),
    h("p", { className: "sub" }, "全 " + WORDS.length + " 語"),

    h("section", null,
      h("h2", null, "範囲指定（No.）"),
      h("input", {
        type: "text",
        className: "text-input",
        placeholder: "例: 1-100, 250-300（空欄で全範囲）",
        value: settings.rangeSpec,
        onChange: (e) => setSettings((s) => ({ ...s, rangeSpec: e.target.value })),
      }),
      h("p", { className: "hint" }, "対象: " + poolSize + " 語")
    ),

    h("section", null,
      h("h2", null, "出題数・順序"),
      h("label", { className: "field-inline" },
        "出題数（空欄で全問）",
        h("input", {
          type: "number",
          min: 1,
          className: "text-input small",
          value: settings.count,
          onChange: (e) => setSettings((s) => ({ ...s, count: e.target.value })),
        })
      ),
      h("label", { className: "field-inline" },
        "順序",
        h("select", {
          className: "text-input small",
          value: settings.order,
          onChange: (e) => setSettings((s) => ({ ...s, order: e.target.value })),
        },
          h("option", { value: "sequential" }, "No.順"),
          h("option", { value: "random" }, "ランダム")
        )
      )
    ),

    h("section", null,
      h("h2", null, "表示"),
      h("label", { className: "check-item" },
        h("input", {
          type: "radio",
          name: "direction",
          checked: settings.direction === "e2j",
          onChange: () => setSettings((s) => ({ ...s, direction: "e2j" })),
        }),
        "単語 → 意味"
      ),
      h("label", { className: "check-item" },
        h("input", {
          type: "radio",
          name: "direction",
          checked: settings.direction === "j2e",
          onChange: () => setSettings((s) => ({ ...s, direction: "j2e" })),
        }),
        "意味 → 単語"
      )
    ),

    h("button", { className: "main-btn", onClick: start, disabled: poolSize === 0 }, "開始")
  );
}

function StudyScreen({ card, index, total, revealed, direction, setRevealed, next, prev, backToSetup }) {
  if (!card) return null;
  const [no, word, meaning] = card;
  const front = direction === "e2j" ? word : meaning;
  const back = direction === "e2j" ? meaning : word;

  return h(
    "div",
    { className: "screen" },
    h("div", { className: "top-row" },
      h("button", { className: "text-btn", onClick: backToSetup }, "← 設定"),
      h("span", null, index + 1 + " / " + total)
    ),

    h("div", { className: "card-area", onClick: () => setRevealed((r) => !r) },
      h("div", { className: "no-label" }, "No. " + no),
      h("div", { className: "front" }, front),
      revealed ? h("div", { className: "back" }, back) : h("div", { className: "back placeholder" }, "（タップで表示）")
    ),

    h("div", { className: "btn-row" },
      h("button", { className: "text-btn", onClick: prev, disabled: index === 0 }, "前へ"),
      h("button", { className: "main-btn small", onClick: () => setRevealed((r) => !r) }, revealed ? "隠す" : "表示"),
      h("button", { className: "text-btn", onClick: next }, index + 1 >= total ? "終了" : "次へ")
    )
  );
}

function DoneScreen({ total, restart, backToSetup }) {
  return h(
    "div",
    { className: "screen" },
    h("h1", null, "終了"),
    h("p", null, total + " 語を学習しました。"),
    h("button", { className: "main-btn", onClick: restart }, "同じ条件でもう一度"),
    h("button", { className: "text-btn", onClick: backToSetup }, "設定に戻る")
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(App));

</script>
